<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Better Translator</title>
<style>
:root { color-scheme: light dark; --ink:#1d1d1f; --muted:#5c5c61; --bg:#ffffff; --link:#0a60c8; }
@media (prefers-color-scheme: dark) { :root { --ink:#f2f2f7; --muted:#abafb0; --bg:#1c1c1e; --link:#6cb4ff; } }
body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
main { max-width:40rem; margin:0 auto; padding:2rem 1.25rem 4rem; }
h1 { font-size:1.9rem; line-height:1.2; margin:0 0 1rem; }
h2 { font-size:1.25rem; margin:2rem 0 .5rem; }
p, li { margin:.6rem 0; }
a { color:var(--link); }
code { font:0.92em ui-monospace, Menlo, monospace; }
.muted { color:var(--muted); }
</style>
</head>
<body>
<main>
<h1>Better Translator</h1>
<p>Live Brazilian Portuguese captions, on your device.</p>
<ul>
<li><a href="privacy/">Better Translator privacy policy</a></li>
<li><a href="support/">Better Translator support</a></li>
</ul>
</main>
</body>
</html>
